# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New > Blueprint" and point it at the repo (Root Directory: server).
# Render creates the web service + Postgres database below and asks you
# to fill in the vars marked "sync: false" (secrets it won't guess for
# you) before the first deploy.
#
# seed.py runs as part of the build (see buildCommand) rather than being
# a one-off manual step, because the interactive Shell tab needs a paid
# plan. It's safe to run on every deploy: db.create_all() only creates
# tables that don't exist yet, and the admin-account/category inserts are
# each guarded by an "if it doesn't already exist" check.

services:
  - type: web
    name: safariadv-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: safariadv-db
          property: connectionString
      # Public frontend origin used by the deployed Vercel app.
      - key: CORS_ORIGINS
        value: https://safari-adv.vercel.app
      # Deployed frontend URL used to build password-reset links.
      - key: FRONTEND_URL
        value: https://safari-adv.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        sync: false
      # https://<this-service>.onrender.com/api/payments/mpesa/callback
      - key: MPESA_CALLBACK_URL
        sync: false

databases:
  - name: safariadv-db
    plan: free
